context:
  version: "2.8.8"

package:
  name: p4est
  version: ${{ version }}

source:
  url: https://github.com/cburstedde/p4est/releases/download/v${{ version }}/p4est-${{ version }}.tar.gz
  sha256: 1ac49b9ff6d73d4fe6a4bea3a90f01330b98115e7371f02b4620494c40757196

build:
  number: 0
  skip:
    - win
  script:
    - if: unix
      then:
        - cmake -B build $CMAKE_ARGS -DBUILD_SHARED_LIBS=ON -DP4EST_USE_SYSTEM_SC=ON -DP4EST_BUILD_EXAMPLES=OFF -DP4EST_BUILD_TESTING=ON -DP4EST_HAVE_JSON=ON
        - cmake --build build --parallel
        - cmake --install build
        - cd build; ctest --output-on-failure

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cmake
    - make
    - pkgconfig # only needed to find jansson, brought by libsc as long as it is not build with cmake

  host:
    - if: unix
      then:
        - openmpi-mpicc
    - libsc
    - zlib

  run_exports:
    - ${{ pin_subpackage('p4est', upper_bound='x.x.x') }}

tests:
  - package_contents:
      lib:
        - p4est

about:
  homepage: https://www.p4est.org/
  summary: 'The "p4est" forest-of-octrees library'
  description: |
    `p4est` is a C library to manage a collection (a forest) of multiple
    connected adaptive quadtrees or octrees in parallel.
  license: LGPL-2.0-only
  license_family: LGPL
  license_file: COPYING
  repository: https://github.com/cburstedde/p4est

extra:
  recipe-maintainers:
    - claudiushaag
